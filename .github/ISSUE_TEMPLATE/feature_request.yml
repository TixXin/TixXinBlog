name: 功能建议
description: 提出新功能或改进想法
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法。提交前请先了解项目的定位。

        TixXinBlog 是**面向单博主的个人博客系统**。为了保持这个定位，下列方向通常不会被接受：

        - 多租户、多作者或团队协作平台
        - 访客注册与访客账号体系
        - 把项目改造成通用 CMS 或内容社区

        这不是说这些想法不好，只是不属于本项目要解决的问题。如果你的建议和上面相关，欢迎说明它如何在单博主前提下成立。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过已有 Issue，没有重复的建议
          required: true
        - label: 我阅读了上面的项目定位说明
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你遇到的实际场景和困扰，而不是直接描述功能
      placeholder: 我在整理旧文章时，总是……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 设想的方案
      description: 期望的行为、涉及的页面或接口、大致的交互
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现有功能、手工做法或其他实现思路，以及为什么不够用

  - type: checkboxes
    id: scope
    attributes:
      label: 涉及范围
      options:
        - label: 公开前台
        - label: 创作后台 `/admin`
        - label: 后端 API 或数据结构
        - label: 主题与外观
        - label: 部署与运行维护

  - type: dropdown
    id: contribute
    attributes:
      label: 是否愿意提交 PR
      options:
        - 愿意，并希望先讨论方案
        - 愿意，需要一些指引
        - 暂时不方便，只是提出想法
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、设计草图、相关链接等
