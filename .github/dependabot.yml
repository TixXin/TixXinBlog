# Dependabot 依赖更新配置
# 文档：https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# 本仓库是 pnpm workspace：根目录持有 pnpm-lock.yaml 与共享开发依赖，
# 两个应用工作区各自声明运行依赖，因此需要分别配置目录。
version: 2
updates:
  # 根工作区：共享开发依赖、格式化与提交钩子
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      # include: scope 会自动追加 (deps)/(deps-dev)，前缀只写类型，避免标题出现 chore(deps)(deps)
      prefix: 'chore'
      prefix-development: 'chore'
      include: scope
    labels:
      - dependencies
    groups:
      根工作区次版本与补丁:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # 前端：Nuxt 4 / Vue 3
  - package-ecosystem: npm
    directory: '/src/frontend/web-blog'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      # include: scope 会自动追加 (deps)/(deps-dev)，前缀只写类型，避免标题出现 chore(deps)(deps)
      prefix: 'chore'
      prefix-development: 'chore'
      include: scope
    labels:
      - dependencies
      - web-blog
    ignore:
      # TypeScript 7 为原生重写，typescript-eslint、vue-tsc 与 Nest 构建尚不支持；生态跟进后移除此项
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      前端次版本与补丁:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # 后端：NestJS / MikroORM
  - package-ecosystem: npm
    directory: '/src/backend/server-main'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      # include: scope 会自动追加 (deps)/(deps-dev)，前缀只写类型，避免标题出现 chore(deps)(deps)
      prefix: 'chore'
      prefix-development: 'chore'
      include: scope
    labels:
      - dependencies
      - server-main
    ignore:
      # TypeScript 7 为原生重写，typescript-eslint、vue-tsc 与 Nest 构建尚不支持；生态跟进后移除此项
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      后端次版本与补丁:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # 持续集成使用的 Actions
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci'
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      Actions 更新:
        patterns:
          - '*'
