# CodeQL 静态代码扫描：JS/TS 单体仓库无需构建，直接以 none 模式分析源码。
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      # 只改说明文档、模板与许可证时不触发；docs/api.md 由 Backend CI 的文档一致性单测覆盖
      - 'docs/**'
      - '*.md'
      - 'LICENSE*'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'patches/README.md'
      - 'src/backend/server-main/README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      # 只改说明文档、模板与许可证时不触发；docs/api.md 由 Backend CI 的文档一致性单测覆盖
      - 'docs/**'
      - '*.md'
      - 'LICENSE*'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'patches/README.md'
      - 'src/backend/server-main/README.md'
  schedule:
    # 每周一 03:17 UTC 做一次全量扫描，保证规则更新后能重新覆盖未改动的代码。
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # 上传扫描结论到 Code scanning
      security-events: write
      # Actions 与仓库内容的只读访问
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          languages: javascript-typescript
          # JS/TS 为解释型语言，无需编译即可建库
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          category: '/language:javascript-typescript'
