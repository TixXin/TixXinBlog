# 持续集成：只读检出源码，同一分支或 PR 的新提交取消过时检查；也供 Release 在标签提交上复用。
name: CI

on:
  # Release 在标签提交上调用，不受下方路径过滤影响。
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      # 只改说明文档、模板与许可证时不触发；docs/api.md 由 Backend CI 的文档一致性单测覆盖
      - 'docs/**'
      - '*.md'
      - 'LICENSE*'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'patches/README.md'
      - 'src/backend/server-main/README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      # 只改说明文档、模板与许可证时不触发；docs/api.md 由 Backend CI 的文档一致性单测覆盖
      - 'docs/**'
      - '*.md'
      - 'LICENSE*'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'patches/README.md'
      - 'src/backend/server-main/README.md'

permissions:
  contents: read

concurrency:
  # 被 Release 调用时 github.workflow 取调用方名称，固定前缀避免与 Release 及另一份 CI 共用并发组而互相取消。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-runner:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
      - name: Development Process Lifecycle
        run: node --test scripts/dev/*.test.mjs

  lint-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://tixxin:tixxin@localhost:5432/tixxin_blog
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tixxin
          POSTGRES_PASSWORD: tixxin
          POSTGRES_DB: tixxin_blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixxin -d tixxin_blog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # 开发、CI 与两套生产镜像统一使用 Node 25。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: pnpm
          # 复用 setup-node 的系统、架构、包管理器与锁文件哈希缓存键。
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Corepack
        run: npm install --global corepack@0.34.6

      - run: pnpm install --frozen-lockfile

      - name: Check Secrets
        run: pnpm check:secrets

      # browser-e2e 按权重表分片，这里确认各片并集正好是全部 spec 且互不重复，防止分片漏跑。
      - name: Browser E2E Shard Coverage
        run: |
          node src/backend/server-main/tests/browser-runner.mjs --list-shards 4 > "$RUNNER_TEMP/e2e-shards.json"
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs"
            const shards = JSON.parse(readFileSync(process.argv[1], "utf8"))
            const listed = shards.flatMap((shard) => shard.files)
            const expected = readdirSync("src/frontend/web-blog/tests/e2e").filter((name) => name.endsWith(".spec.ts")).sort()
            const actual = [...listed].sort()
            if (shards.length !== 4) throw new Error(`分片数应为 4，实际 ${shards.length}`)
            if (new Set(listed).size !== listed.length) throw new Error("分片之间存在重复文件")
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`分片与 spec 全集不一致：${JSON.stringify({ expected, actual })}`)
            for (const shard of shards) console.log(`分片 ${shard.shard}：${shard.files.length} 个文件，预计 ${Math.round(shard.weight)} 秒`)
          ' "$RUNNER_TEMP/e2e-shards.json"

      - name: Lint
        run: pnpm lint

      # 安装脚本与 tixxin 管理命令；固定官方 v0.11.0 并校验，托管机自带的 0.9.0 会把陷阱函数误报为不可达。
      - name: Shell Lint
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" --version

      - name: Run Shell Lint
        run: pnpm lint:shell

      - name: Type Check
        run: pnpm --filter web-blog exec nuxt typecheck

      - name: Nuxt Startup Patch Regression
        run: pnpm test:nuxt-patches

      - name: Subscription Domain
        run: pnpm test:subscription-domain

      # 单测只跑带覆盖率的一遍：用例失败照常阻断，覆盖率只收集与上传，不设阈值门禁。
      - name: Test with Coverage
        run: pnpm --filter web-blog exec vitest run --coverage

      - name: Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: src/frontend/web-blog/coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Build Backend for Browser Tests
        run: pnpm --filter server-main build

      - name: Isolated Development Startup
        run: pnpm test:dev:integration

      - name: Isolated PostgreSQL Startup
        run: pnpm test:dev:postgres

      - name: Frontend Docker Build
        run: docker build -t tixxin-blog-web:ci .

      - name: Backend and Migration Docker Build
        run: |
          docker build -f src/backend/server-main/Dockerfile -t tixxin-blog-api:ci .
          docker build -f src/backend/server-main/Dockerfile --target migration -t tixxin-blog-migration:ci .

      - name: Production Container Smoke
        env:
          WEB_IMAGE: tixxin-blog-web:ci
          API_IMAGE: tixxin-blog-api:ci
          MIGRATION_IMAGE: tixxin-blog-migration:ci
        run: node scripts/container-smoke.mjs

      # 与 API 共用构建阶段缓存；一键安装的备份在 worker 镜像内执行。
      - name: Worker Docker Build
        run: docker build -f src/backend/server-main/Dockerfile --target worker -t tixxin-blog-worker:ci .

      # 用本次镜像与本地部署包运行 install.sh --local --yes，再验收备份、同版本升级、失败升级、跨版本升级与回退。
      - name: Install Script Smoke
        env:
          SMOKE_WEB_IMAGE: tixxin-blog-web:ci
          SMOKE_API_IMAGE: tixxin-blog-api:ci
          SMOKE_MIGRATION_IMAGE: tixxin-blog-migration:ci
          SMOKE_WORKER_IMAGE: tixxin-blog-worker:ci
        run: bash scripts/release/install-smoke.sh

      - name: Audit Dependencies
        run: pnpm audit --prod --audit-level=high

  # 全部浏览器 spec 按文件分 4 片并行；每片各自构建，文件仍逐个使用独立进程与隔离库。
  browser-e2e:
    name: Browser E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # 各片独立报告，一片失败不取消其余分片。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DATABASE_URL: postgres://tixxin:tixxin@localhost:5432/tixxin_blog
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tixxin
          POSTGRES_PASSWORD: tixxin
          POSTGRES_DB: tixxin_blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixxin -d tixxin_blog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Corepack
        run: npm install --global corepack@0.34.6

      - run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build

      - name: Build Backend for Browser Tests
        run: pnpm --filter server-main build

      - name: Resolve Playwright Version
        id: playwright
        working-directory: src/frontend/web-blog
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # 浏览器二进制按系统与 Playwright 版本缓存；系统库不在缓存内，命中时仍需单独安装。
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web-blog exec playwright install --with-deps chromium

      - name: Install Chromium System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web-blog exec playwright install-deps chromium

      - name: Browser E2E on Isolated Database
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
        run: pnpm test:e2e:run

      - name: Browser Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-failure-${{ matrix.shard }}
          path: .playwright-mcp/e2e-results
          retention-days: 5

  webkit-smoke:
    name: WebKit Core E2E
    runs-on: ubuntu-latest
    # 含依赖安装、WebKit 系统库、两端生产构建，以及两个完整 spec。上限只约束本 job。
    timeout-minutes: 60
    env:
      DATABASE_URL: postgres://tixxin:tixxin@localhost:5432/tixxin_blog
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tixxin
          POSTGRES_PASSWORD: tixxin
          POSTGRES_DB: tixxin_blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixxin -d tixxin_blog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Corepack
        run: npm install --global corepack@0.34.6

      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright Version
        id: playwright
        working-directory: src/frontend/web-blog
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright WebKit
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ steps.playwright.outputs.version }}

      - name: Install WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web-blog exec playwright install --with-deps webkit

      - name: Install WebKit System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web-blog exec playwright install-deps webkit

      - name: Build Frontend
        run: pnpm build

      - name: Build Backend for Browser Tests
        run: pnpm --filter server-main build

      # 核心发布、评论、三主题与管理闭环；保留整个文件的断言和代表数据。
      - name: WebKit Blog Core on Isolated Database
        # 记录浏览器进程输出：偶发的 WebKit internal error 疑为网络进程崩溃，失败时据此确认
        env:
          DEBUG: pw:browser
        run: pnpm test:e2e:run blog.spec.ts --browser=webkit

      # 单独运行以重新建库，避免前一个文件的写入污染水合与历史导航验收。
      - name: WebKit Hydration and History on Isolated Database
        # 记录浏览器进程输出：偶发的 WebKit internal error 疑为网络进程崩溃，失败时据此确认
        env:
          DEBUG: pw:browser
        run: pnpm test:e2e:run hydration-history.spec.ts --browser=webkit

      - name: WebKit Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webkit-e2e-failure
          path: .playwright-mcp/e2e-results
          retention-days: 5
