# 后端持续集成：限制令牌权限，并取消同一分支或 PR 的过时检查。
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'compose.production.yaml'
      - 'deploy/**'
      - 'scripts/release/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'compose.production.yaml'
      - 'deploy/**'
      - 'scripts/release/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://tixxin:tixxin@localhost:5432/tixxin_blog
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tixxin
          POSTGRES_PASSWORD: tixxin
          POSTGRES_DB: tixxin_blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixxin -d tixxin_blog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: pnpm
          # 与前端共享根锁文件，缓存只保存 pnpm 包存储，不保存 node_modules。
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Corepack
        run: npm install --global corepack@0.34.6

      - run: pnpm install --frozen-lockfile

      - name: Check Secrets
        run: pnpm check:secrets

      - name: Lint
        run: pnpm --filter server-main lint

      - name: Type Check
        run: pnpm --filter server-main typecheck

      - name: Test
        run: pnpm --filter server-main test

      # 覆盖率只收集与上传，不设阈值门禁。
      - name: Backend Coverage
        run: pnpm --filter server-main test:coverage

      - name: Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: src/backend/server-main/coverage
          if-no-files-found: ignore
          retention-days: 7

      # 在全新数据库上重放全部迁移,并校验实体与 schema 零漂移(development.md §8.1)
      - name: Migration Up + Check
        run: |
          pnpm --filter server-main migration:up
          pnpm --filter server-main migration:check

      - name: Build
        run: pnpm --filter server-main build

      - name: HTTP Integration on Isolated Database
        run: pnpm --filter server-main test:integration

      - name: Development Database Tools on Isolated Database
        env:
          BACKUP_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm --filter server-main test:database-dev

      - name: Sustainable Content and Operations on Isolated Targets
        env:
          BACKUP_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          pnpm --filter server-main exec tsx tests/initial-profile-integration.ts
          pnpm --filter server-main exec tsx tests/editorial-fixtures-integration.ts
          pnpm --filter server-main exec tsx tests/sustainable-fixtures-integration.ts
          pnpm --filter server-main exec node tests/operations-integration.mjs
          pnpm --filter server-main exec node tests/backup-integrity-integration.mjs
          pnpm --filter server-main exec node tests/manual-backup-record-integration.mjs
          node --test scripts/release/release.test.mjs
          node --test scripts/release/production-artifact-cleanup.test.mjs

      - name: Docker Build
        run: docker build -f src/backend/server-main/Dockerfile -t tixxin-blog-server .

      - name: Migration Image Build
        run: docker build -f src/backend/server-main/Dockerfile --target migration -t tixxin-blog-migration .

      - name: Worker Image Build
        run: docker build -f src/backend/server-main/Dockerfile --target worker -t tixxin-blog-worker .

      - name: Full Backup Restore on Isolated Container
        env:
          BACKUP_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RESTORE_API_IMAGE: tixxin-blog-server
        run: node src/backend/server-main/tests/full-backup-integration.mjs

      - name: Restore Verification Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restore-verification
          path: |
            .backups/**/verification-report.json
            .artifacts/**/verification-report.json
          if-no-files-found: ignore
          retention-days: 5
