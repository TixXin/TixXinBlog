# 版本发布：推送 v* 标签后校验、按平台构建四类镜像并推送到 GHCR，冒烟通过后再打版本标签并创建 GitHub Release。
# 只推送版本号与完整提交 SHA 两类不可复用标签，不推送 latest（发布脚本拒绝 latest）。
name: Release

on:
  push:
    tags: ['v*']

# 默认不授予任何权限，由各 job 按需声明。
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image-prefix: ${{ steps.meta.outputs.image-prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 需要完整历史判断标签提交是否已合入 main。
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Tag, Version and Changelog
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::标签必须是 v<主>.<次>.<修订>[-预发布]，当前为 $TAG"
            exit 1
          fi
          version="${TAG#v}"
          package_version="$(jq -r .version package.json)"
          if [ "$package_version" != "$version" ]; then
            echo "::error::根 package.json 版本为 $package_version，与标签 $TAG 不一致"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::标签提交尚未合入 main，拒绝发布"
            exit 1
          fi
          # 截取 CHANGELOG 中对应版本段落，去掉末尾的版本比较链接。
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md 缺少 ## [$version] 段落或段落为空"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            # GHCR 仓库名必须小写。
            echo "image-prefix=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # 一键安装资产：部署包、写入本次固定版本的 install.sh 与 SHA256SUMS；内容只来自标签提交中跟踪的部署文件。
  deploy-package:
    name: Build Deploy Package
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package Deploy Assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREFIX: ${{ needs.prepare.outputs.image-prefix }}
        run: |
          bash scripts/release/package-deploy.sh --version "$VERSION" --repository "$GITHUB_REPOSITORY" \
            --image-prefix "$PREFIX" --output "$RUNNER_TEMP/deploy-package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-package
          path: ${{ runner.temp }}/deploy-package/*
          if-no-files-found: error
          retention-days: 7

  # 同一标签提交上并行复用完整 CI 与 Backend CI，全部通过后才构建镜像。
  # 调用 job 的 permissions 是被调用工作流的上限；两份工作流自身声明 contents: read，缓存与产物上传使用运行时令牌，不需要额外权限。
  verify:
    name: Verify Full CI
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  verify-backend:
    name: Verify Full Backend CI
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/backend-ci.yml

  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: [prepare, verify, verify-backend]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: web
            file: Dockerfile
            target: runtime
            description: TixXinBlog Nuxt 前端
          - name: api
            file: src/backend/server-main/Dockerfile
            target: runtime
            description: TixXinBlog NestJS API
          - name: migration
            file: src/backend/server-main/Dockerfile
            target: migration
            description: TixXinBlog 一次性数据库迁移
          - name: worker
            file: src/backend/server-main/Dockerfile
            target: worker
            description: TixXinBlog 维护任务 worker
        # 使用原生 arm64 托管机，避免 QEMU 模拟构建 Nuxt 与原生依赖。
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.prepare.outputs.image-prefix }}-${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}-${{ matrix.image.name }}
            org.opencontainers.image.description=${{ matrix.image.description }}

      # 按摘要推送单平台镜像，冒烟通过后再合并为多架构清单并打标签。
      - name: Build and Push by Digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Export Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Container Smoke (${{ matrix.platform.arch }})
    needs: [prepare, build]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: true
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests

      # 冒烟脚本只接受本地标签名，按摘要拉取后改名。
      - name: Pull Images by Digest
        env:
          PREFIX: ${{ needs.prepare.outputs.image-prefix }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          for name in web api migration; do
            digest="$(ls "$RUNNER_TEMP/digests/digests-$name-$ARCH")"
            docker pull "$PREFIX-$name@sha256:$digest"
            docker tag "$PREFIX-$name@sha256:$digest" "tixxin-blog-$name:release-smoke"
          done

      - name: Production Container Smoke
        env:
          WEB_IMAGE: tixxin-blog-web:release-smoke
          API_IMAGE: tixxin-blog-api:release-smoke
          MIGRATION_IMAGE: tixxin-blog-migration:release-smoke
        run: node scripts/container-smoke.mjs

  publish-images:
    name: Publish ${{ matrix.name }} Manifest
    needs: [prepare, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [web, api, migration, worker]
    env:
      IMAGE: ${{ needs.prepare.outputs.image-prefix }}-${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Create Multi-Arch Manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag", .' <<< "$META_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Record Image Reference
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          mkdir -p "$RUNNER_TEMP/image-refs"
          echo "| \`${{ matrix.name }}\` | \`$IMAGE:$VERSION\` | \`$digest\` |" > "$RUNNER_TEMP/image-refs/${{ matrix.name }}.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-ref-${{ matrix.name }}
          path: ${{ runner.temp }}/image-refs/${{ matrix.name }}.md
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub Release
    needs: [prepare, publish-images, deploy-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-ref-*
          path: ${{ runner.temp }}/image-refs
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-package
          path: ${{ runner.temp }}/deploy-package

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release/notes-with-images.md"
          {
            cat "$RUNNER_TEMP/release/release-notes.md"
            echo
            echo '## 镜像'
            echo
            echo '每个镜像同时提供 linux/amd64 与 linux/arm64，并附 SBOM 与构建来源证明；另有 `sha-<完整提交 SHA>` 标签。部署方式见 docs/deployment.md。'
            echo
            echo '| 镜像 | 引用 | 清单摘要 |'
            echo '| --- | --- | --- |'
            for name in web api migration worker; do cat "$RUNNER_TEMP/image-refs/$name.md"; done
            echo
            echo '## 一键安装'
            echo
            echo "下载本版本安装脚本，查看内容后以 root 运行；脚本先校验部署包 SHA256，再安装 \`$VERSION\`："
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh -o install.sh"
            echo 'sudo bash install.sh'
            echo '```'
          } > "$notes"
          flags=()
          if [ "$PRERELEASE" = 'true' ]; then flags+=(--prerelease); else flags+=(--latest); fi
          # 部署包、安装脚本与校验和作为资产随发布上传，标记 latest 前资产已就位；重跑时覆盖同名资产。
          assets="$RUNNER_TEMP/deploy-package"
          (cd "$assets" && sha256sum -c SHA256SUMS)
          files=("$assets/tixxin-blog-$VERSION.tar.gz" "$assets/install.sh" "$assets/SHA256SUMS")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$notes" "${flags[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$notes" "${flags[@]}" "${files[@]}"
          fi
