# 本地开发数据库（不含应用本身）；当前运行依赖只需 PostgreSQL
# 在本目录使用：docker compose --env-file .env.local up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: tixxin-blog-postgres
    environment:
      POSTGRES_USER: tixxin
      POSTGRES_PASSWORD: tixxin
      POSTGRES_DB: tixxin_blog
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tixxin -d tixxin_blog']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
